version: 2
updates:
  # Build and test dependencies; the packaged extension bundles what it needs with esbuild.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm-deps:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Pinned to engines.vscode (^1.90.0): a newer API typing would let code use calls the oldest supported editor lacks.
      - dependency-name: "@types/vscode"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
