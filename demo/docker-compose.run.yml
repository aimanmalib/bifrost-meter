# Overlay used by demo/run.sh on top of demo/docker-compose.yml and test/e2e/docker-compose.e2e.yml:
# gives the in-browser editor the demo key and gateway URL through its environment, so the meter starts without typing.
services:
  bifrost-meter-code-server:
    environment:
      BIFROST_VIRTUAL_KEY: ${BIFROST_METER_DEMO_KEY:?demo/run.sh sets this after seeding}
      BIFROST_BASE_URL: http://localhost:8080
