# Content and look of the submission deck. Edit this file, then run `npm run deck`.
# Every number on a slide must come from docs/TEST-RESULTS.md or the README.
# Image paths are relative to the repository root.

output: deck/bifrost-meter.pptx
footer: "Bifrost Meter (Unofficial)"

# Phrases on the slides that become clickable links. The text stays as written; only the link is added.
links:
  "github.com/aimanmalib/bifrost-meter": "https://github.com/aimanmalib/bifrost-meter"
  "youtu.be/yDtBFdKZWcw": "https://youtu.be/yDtBFdKZWcw"
  "pull request 10044": "https://github.com/maximhq/bifrost/pull/10044"
  "PR #10050": "https://github.com/maximhq/bifrost/pull/10050"
  "Open VSX (aimanmalib.bifrost-meter)": "https://open-vsx.org/extension/aimanmalib/bifrost-meter"

theme:
  font: Arial
  mono: Courier New
  background: "0F1216"
  ink: "ECEFF3"
  muted: "9BA5B4"
  accent: "3DD6A3"
  rule: "2B313B"
  card: "171B21"
  panel: "0A0C0F"
  panel_ink: "DCE3EC"
  tag_fill: "16302A"

slides:
  - layout: title
    title: "Bifrost Meter (Unofficial)"
    subtitle: "Your Bifrost virtual key's budget, in the VS Code status bar."
    lines:
      - "Global AI Hackathon, PS04 \"Open-Source Bifrost Gateway\""
      - "Aiman Malib, solo"
      - "github.com/aimanmalib/bifrost-meter"
      - "Upstream PR #10050 approved by a Bifrost maintainer · Listed on Open VSX"
    image: docs/images/demo-warning.png
    crop: [0.23, 0.03, 0.0, 0.0]

  - layout: text
    title: "Problem"
    tag: "Problem and potential impact"
    body:
      - "Bifrost enforces budgets per virtual key. The admin sees them in the dashboard. The developer holding the key sees nothing until a request is refused."
      - "An operator asked for this in the Bifrost tracker (issue 6482, 24 Aug 2026): callers \"need to see their own spend and remaining budget in lightweight clients\"."
      - "Bifrost already returns a key's own limits to whoever holds the key (since v1.5.0). Nothing in the editor reads it."

  - layout: table
    title: "Who is affected, and what exists"
    tag: "Problem and potential impact"
    columns: ["Where I searched (14 Nov 2026)", "What I found"]
    widths: [4.4, 7.4]
    rows:
      - ["VS Code Marketplace, \"bifrost\"", "10 extensions. None shows usage or budgets."]
      - ["Open VSX, \"bifrost\"", "4 extensions. None shows usage or budgets."]
      - ["GitHub, \"bifrost vscode\" and \"bifrost budget\"", "11 and 14 repositories. No editor client."]
      - ["Existing budget readers", "A web dashboard, an MCP server, the Bifrost CLI and desktop monitors (CodexBar, Pulse, TokenBar). All outside the editor."]
    note: "Affected: developers who send coding agents through a Bifrost virtual key, and the operators who set its budget."

  - layout: stack
    title: "Solution"
    tag: "Innovation"
    body:
      - "One number, where you already look."
      - "Status bar: percent used, amount left, time to reset."
      - "Tooltip and panel: every limit on the key. The status bar shows the strictest."
      - "One warning at 75% and one at 90%, and an estimate of when the budget runs out."
    # crop = [left, top, right, bottom] as fractions of the screenshot (here: the status bar item).
    images:
      - {path: docs/images/demo-ok.png, caption: "OK", crop: [0.69, 0.955, 0.0, 0.0]}
      - {path: docs/images/demo-warning.png, caption: "Warning", crop: [0.69, 0.955, 0.0, 0.0]}
      - {path: docs/images/demo-exhausted.png, caption: "Used up", crop: [0.69, 0.955, 0.0, 0.0]}

  - layout: images
    title: "Demo"
    tag: "User experience"
    body:
      - "One command starts the official Bifrost image, a mock model and an editor in the browser."
      - "The meter is already connected, and the demo budget runs a full cycle every 5 minutes."
      - "Narrated video, 79 seconds: youtu.be/yDtBFdKZWcw. GIF in the README."
    image_height: 3.3
    images:
      - {path: deck/assets/video-tooltip.jpg, caption: "Hover: every limit on the key, with a forecast", crop: [0.3, 0.15, 0.04, 0.0]}
      - {path: docs/images/demo-exhausted.png, caption: "At 100% the gateway refuses requests; the meter says so", crop: [0.24, 0.09, 0.0, 0.0]}

  - layout: diagram
    title: "Technical architecture"
    tag: "Technical execution"
    body:
      - "The extension reads one endpoint: GET /api/governance/virtual-keys/quota, with the virtual key in the x-bf-vk header."
      - "No admin credential. No plugin to load. No change to Bifrost."
      - "The editor extension and the MCP server share one core: client, shape check, limits, forecast."
    # Boxes in inches inside the diagram area (right half of the slide).
    nodes:
      - {id: ext, label: "VS Code extension\nstatus bar, tooltip, panel", x: 0.0, y: 0.0, w: 2.6, h: 1.0}
      - {id: mcp, label: "MCP server\nget_budget_status", x: 3.0, y: 0.0, w: 2.6, h: 1.0}
      - {id: core, label: "Shared core\nclient, schema, model, forecast", x: 0.8, y: 1.9, w: 4.0, h: 1.0, strong: true}
      - {id: gw, label: "Bifrost gateway, official image\nGET /api/governance/virtual-keys/quota", x: 0.3, y: 3.8, w: 5.0, h: 1.0}
    edges:
      - {from: ext, to: core}
      - {from: mcp, to: core}
      - {from: core, to: gw, label: "x-bf-vk header"}

  - layout: text
    title: "Implementation"
    tag: "Technical execution"
    body:
      - "The key stays in the editor's secret storage. Screens and logs show its last 4 characters only."
      - "The key is sent to one host. Redirects to another host are refused. Plain http to a public host is refused."
      - "14 display states. Each has one sentence that says what happened and what to do."
      - "A response without a required field shows an error, not a zero. English and Bahasa Melayu."
    size: 18
    stats:
      - {value: "391", label: "unit tests passed"}
      - {value: "11", label: "contract tests, official image"}
      - {value: "9", label: "end-to-end tests in a real editor"}
      - {value: "6.9 ms", label: "median quota read, demo stack"}

  - layout: code
    title: "For agents"
    tag: "Use of AI"
    body:
      - "get_budget_status is an MCP tool that returns the same limits as structured data."
      - "A coding agent can call it before a long task, then stop or ask when little is left."
      - "For agents in a terminal, one line: Bifrost 26% · $0.73 left · resets in 3m."
    code_caption: "Real tools/call output (contract test, pinned gateway)"
    code: |
      Key demo-team-a (…8280),
        read at 2026-11-14T18:46:36Z.
      Budget: $0.0013 of $5.00 used (<0.1%),
        $4.99 left, resets in 23h 59m.
      Tokens: 600 of 100k used (0.6%),
        99.4k tokens left, resets in 59m.
      Requests: 3 of 200 used (1%),
        197 requests left, resets in 59m.
      No forecast yet: it needs two readings
        at least 2m apart.

  - layout: table
    title: "Tests and the PS04 requirements"
    tag: "Technical execution"
    columns: ["PS04 requirement", "Evidence"]
    widths: [3.4, 8.4]
    rows:
      - ["Real operator problem", "Issue 6482. End to end in a real editor: set the key, send traffic, see the warning. 9 tests passed."]
      - ["Public extension points", "The documented quota endpoint, and MCP for agents. 391 unit tests passed."]
      - ["Reproducible integration", "Official Bifrost image v2.5.1, unmodified, pinned by digest. 11 contract tests passed."]
      - ["Contribution quality", "Two tested gateway changes are open upstream. Pull request 10050 (next reset time) was approved by a Bifrost maintainer on 17 Nov 2026. Pull request 10044 (enforced limit after an override) is waiting for review. Docs, Apache-2.0."]
    note: "Each quota read costs the gateway p50 6.9 ms, p95 12.2 ms on the demo stack (200 reads). Numbers from docs/TEST-RESULTS.md."

  - layout: text
    title: "How AI is used"
    tag: "Use of AI"
    body:
      - "In the product: no model calls. The meter serves people and agents who use models through Bifrost. Agents read their own budget through the MCP tool."
      - "In the build: AI coding agents (Anthropic Claude models) wrote the code, tests, documentation and these slides. I approved the idea and the plan, and I watched the demo before I submitted. I am responsible for it."

  - layout: text
    title: "Limits and next"
    tag: "Scalability and potential"
    body:
      - "Limits today: budgets on a team or customer above the key are not in the quota response. The meter is a gauge, not an audit log. Tested on one gateway version."
      - "Found while building it: the quota response has no enforced limit after an admin override and no next reset time. The meter recomputes both with the gateway's own rules, and contract tests check them. Both fixes are open upstream. Pull request 10050 is approved. Pull request 10044 is waiting for review."
      - "Listed on Open VSX (aimanmalib.bifrost-meter). If the Bifrost team wants the extension itself, the repository can move under their organisation. It is Apache-2.0, like Bifrost. Next: a Marketplace listing, usage history once issue 6482 lands, and a JetBrains version."

  - layout: end
    title: "Thank you."
    lines:
      - "Repository, release with the .vsix file, and the demo video:"
      - "github.com/aimanmalib/bifrost-meter"
